name: Daily AgriWeather fetch

# 매일 자동 실행 + 수동 실행 버튼
on:
  schedule:
    - cron: '*/20 22-23 * * *'  # 07:00~08:40 KST (20분 간격)
    - cron: '*/20 0-3 * * *'    # 09:00~12:40 KST (20분 간격)
  workflow_dispatch:

# CSV를 커밋/푸시하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch daily average temperature
        env:
          # 인증키는 코드가 아니라 저장소 Secret에서 주입 (아래 안내 참고)
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python fetch_agri365_to_csv_v3.py --skip-bad-months

      - name: Commit & push if the CSV changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add input_daily_avgtemp.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: update daily avg temp ($(date -u +%Y-%m-%d) UTC)"
            git push
          fi
